name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Georgia (for the division/department line)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          sudo fc-cache -f

      - name: Install LaTeX packages for the XeLaTeX format
        run: |
          tlmgr update --self
          tlmgr install tex-gyre fontspec fancyhdr ragged2e euenc xcolor geometry

      - name: Run smoke tests (XeLaTeX + Typst)
        run: bash scripts/smoke-test.sh
